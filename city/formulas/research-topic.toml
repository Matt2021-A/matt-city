formula = "research-topic"
description = "Produce a sourced, read-only research and analysis package linked to an Asana work object."

[requires]
formula_compiler = ">=2.0.0"

[vars.request_id]
description = "Matt City request identifier"
required = true

[vars.asana_project_gid]
description = "Originating Asana project GID"
required = true

[vars.asana_task_gid]
description = "Originating Asana task GID"
required = true

[vars.request_path]
description = "Path to the approved request package inside the rig"
required = true

[[steps]]
id = "research"
title = "Collect and normalize sources for {{request_id}}"
description = "Read {{request_path}}. Produce a source inventory and evidence-backed findings. Preserve the originating Asana project {{asana_project_gid}} and task {{asana_task_gid}} in artifact metadata."
assignee = "matt-city/matt.researcher"
metadata = { request_id = "{{request_id}}", asana_project_gid = "{{asana_project_gid}}", asana_task_gid = "{{asana_task_gid}}" }
[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"

[[steps]]
id = "technical-analysis"
title = "Produce technical analysis for {{request_id}}"
description = "Use the approved research findings to explain architecture, components, dependencies, operational behavior, and technical unknowns."
needs = ["research"]
assignee = "matt-city/matt.technical-analyst"
metadata = { request_id = "{{request_id}}", asana_project_gid = "{{asana_project_gid}}", asana_task_gid = "{{asana_task_gid}}" }
[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"

[[steps]]
id = "identity-security-analysis"
title = "Produce identity and security analysis for {{request_id}}"
description = "Evaluate principals, authentication, authorization, credentials, delegation, provenance, approval boundaries, and blast radius."
needs = ["research", "technical-analysis"]
assignee = "matt-city/matt.identity-security-analyst"
metadata = { request_id = "{{request_id}}", asana_project_gid = "{{asana_project_gid}}", asana_task_gid = "{{asana_task_gid}}" }
[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"

[[steps]]
id = "skeptical-review"
title = "Challenge the analysis for {{request_id}}"
description = "Identify unsupported claims, hidden assumptions, missing evidence, alternative interpretations, and required verification."
needs = ["research", "technical-analysis", "identity-security-analysis"]
assignee = "matt-city/matt.skeptic"
metadata = { request_id = "{{request_id}}", asana_project_gid = "{{asana_project_gid}}", asana_task_gid = "{{asana_task_gid}}" }
[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"

[[steps]]
id = "package-artifacts"
title = "Package artifacts and provenance for {{request_id}}"
description = "Create the final artifact index and provenance record. Include the Asana project and task GIDs, Gas City workflow and bead identifiers, agents and sessions used, providers, inputs, outputs, capabilities, and approval state. Do not perform external writes."
needs = ["research", "technical-analysis", "identity-security-analysis", "skeptical-review"]
assignee = "matt-city/matt.technical-analyst"
metadata = { request_id = "{{request_id}}", asana_project_gid = "{{asana_project_gid}}", asana_task_gid = "{{asana_task_gid}}" }
[steps.retry]
max_attempts = 2
on_exhausted = "hard_fail"
