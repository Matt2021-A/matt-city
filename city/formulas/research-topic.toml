# Phase 1 workflow skeleton.
# Gas City-specific execution fields will be validated after installation in WSL.

[formula]
name = "research-topic"
description = "Produce a sourced, read-only research and analysis package."

[[steps]]
id = "research"
agent = "researcher"
input = "requests/{{request_id}}.yaml"
output = "artifacts/generated/{{request_id}}/findings.yaml"

[[steps]]
id = "technical-analysis"
agent = "technical-analyst"
needs = ["research"]
input = "artifacts/generated/{{request_id}}/findings.yaml"
output = "artifacts/generated/{{request_id}}/technical-analysis.md"

[[steps]]
id = "identity-security-analysis"
agent = "identity-security-analyst"
needs = ["research", "technical-analysis"]
output = "artifacts/generated/{{request_id}}/identity-security-analysis.md"

[[steps]]
id = "skeptical-review"
agent = "skeptic"
needs = ["research", "technical-analysis", "identity-security-analysis"]
output = "artifacts/generated/{{request_id}}/skeptic-review.md"

[[steps]]
id = "human-gate"
type = "wait"
needs = ["skeptical-review"]
reason = "Matthew reviews the complete evidence package before downstream use."
