[pack]
name = "matt-city"
schema = 2
description = "Identity-aware, Asana-linked research and analysis agents and workflows for the Matt City rig."

[[pack.requires]]
scope = "rig"
agent = "researcher"

[[pack.requires]]
scope = "rig"
agent = "technical-analyst"

[[pack.requires]]
scope = "rig"
agent = "identity-security-analyst"

[[pack.requires]]
scope = "rig"
agent = "skeptic"

# The research workflow is target-required and must launch through a concrete
# rig-local operator. The upstream gascity/roles import supplies this target.
[[pack.requires]]
scope = "rig"
agent = "gc.run-operator"
