[workspace]
provider = "codex"

[providers.codex]
base = "builtin:codex"

# Phase 1 uses the file backend because Gas City 1.3.4 and Beads 1.1.0
# reproduced the schema-migration failure tracked in gastownhall/beads#4566
# during clean Dolt-backed rig initialization. This remains temporary.
[beads]
provider = "file"

[[rigs]]
name = "matt-city"
default_branch = "main"

# Hand-authored Matt City agents, including the rig-local run operator,
# and the bounded research workflow.
[rigs.imports.matt]
source = "/home/matt/src/matt-city/city"
