[workspace]
provider = "codex"

[providers.codex]
base = "builtin:codex"

# Matt City uses the bd-backed Dolt provider for workflow state,
# dependency readiness, routed claims, and dispatcher demand.
[beads]
provider = "bd"

[[rigs]]
name = "matt-city"
default_branch = "main"

# Hand-authored Matt City agents, including the rig-local run operator,
# and the bounded research workflow.
[rigs.imports.matt]
source = "/home/matt/src/matt-city/city"
