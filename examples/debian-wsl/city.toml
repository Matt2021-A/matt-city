[workspace]
provider = "codex"

[providers.codex]
base = "builtin:codex"

# Phase 1 uses the file backend because Gas City 1.3.4 and Beads 1.1.0
# reproduced the schema-migration failure tracked in gastownhall/beads#4566
# during clean Dolt-backed rig initialization. This remains temporary.
[beads]
provider = "file"

[[rigs]]
name = "matt-city"
default_branch = "main"

# Hand-authored Matt City agents and research workflow.
[rigs.imports.matt]
source = "/home/matt/src/matt-city/city"

# Upstream rig-local role workers. This provides gc.run-operator for the
# supported target-plus-formula launch pattern. Run `gc import install`
# after adding or changing this import and verify the resolved target before use.
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
